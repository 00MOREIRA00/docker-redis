# A senha é fornecida pelo Compose via REDIS_PASSWORD na inicialização.
# A publicação no host é restrita a 127.0.0.1 pelo Compose.
bind 0.0.0.0
protected-mode yes
port 6379

dir /data
dbfilename dump.rdb
# Snapshot após 60 segundos quando houver pelo menos uma alteração.
save 60 1
appendonly no

daemonize no
logfile ""
